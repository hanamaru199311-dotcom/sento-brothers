<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>大戦闘先東ブラザーズ</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b1223;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif}button,input{font:inherit}button{cursor:pointer}#banner{width:100%;display:block;max-height:245px;object-fit:cover;object-position:center}.shell{max-width:620px;margin:auto}.card{margin:14px;padding:18px;border:1px solid #425575;border-radius:18px;background:#192942}.title{text-align:center;font-size:24px;font-weight:1000;margin:14px 0 4px}.sub{text-align:center;color:#c9d5e9;font-size:13px}.field{width:100%;padding:13px;border:2px solid #69809f;border-radius:12px;background:#0b182b;color:white;font-size:18px}.primary{background:#f0b637;color:#111827;border:0;border-radius:13px;padding:14px 20px;font-size:17px;font-weight:900;width:100%;margin-top:12px}.secondary{background:#334b6a;color:white;border:1px solid #7185a1;border-radius:11px;padding:9px 12px}.teams{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.team{padding:13px 0;border-radius:11px;color:#172033;border:3px solid transparent;font-weight:900}.team.sel{border-color:white;box-shadow:0 0 0 2px #a879fc}.small{color:#c7d3e5;font-size:12px;line-height:1.7}.muted{color:#9cacc4}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}.stat{text-align:center;border-radius:9px;padding:7px 2px;color:#142031;font-weight:900}.progress{height:12px;background:#33445b;border-radius:30px;overflow:hidden;margin:14px 0}.progress>div{height:100%;background:#60d394;transition:width .3s}.names{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.chip{padding:6px 9px;border-radius:8px;font-size:12px;font-weight:800;color:#111827}.error{color:#ff9999;min-height:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:5px;font-size:13px;padding:6px 10px}.game{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}#arenaWrap{position:relative;flex:1;min-height:0;margin:5px 8px;border:3px solid #7488a5;border-radius:16px;overflow:hidden;background:#203852}canvas{width:100%;height:100%;display:block}#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0b1427b8;text-align:center;font-size:35px;font-weight:1000;text-shadow:0 3px 10px #000;z-index:2}#padWrap{height:35%;min-height:175px;max-height:300px;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:4px}#pad{position:relative;height:calc(100% - 27px);max-width:95vw;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#38516d,#15263f);border:4px solid #8498b6;touch-action:none;user-select:none}#pad:before{content:'';position:absolute;inset:22%;border:2px dashed #7389a6;border-radius:50%}#padName{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:32%;aspect-ratio:1;border:3px solid #fff;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:900;pointer-events:none}#pointer{position:absolute;top:50%;left:50%;height:5px;width:30%;background:#fff;transform-origin:left center;display:none;border-radius:6px;pointer-events:none}#final{position:fixed;inset:0;background:#080e1bf5;z-index:20;display:none;align-items:center;justify-content:center;text-align:center;padding:20px}#final img{height:220px;width:220px;object-fit:cover;object-position:center 20%;border-radius:50%;border:6px solid white;box-shadow:0 0 35px #faaf48}#final h1{font-size:36px}#final h2{font-size:30px;color:#f7c13e}#host{margin-top:18px;border-top:1px solid #455a76;padding-top:12px}#hostDetails{display:none}#hostDetails.on{display:block}#waiting h2{margin:8px 0}#countdown{font-size:46px;color:#ffdf72;font-weight:1000;text-align:center}

#hero{position:relative;background:#0b1223;border-bottom:4px solid #f0b637}#hero img{width:100%;display:block;aspect-ratio:3/1;object-fit:cover}.hero-logo{font-weight:1000;text-align:center;font-size:clamp(25px,7vw,42px);padding:10px;color:white;text-shadow:2px 3px #000}.hero-logo strong{color:#ffd54c}
.count{text-align:center;font-size:23px;font-weight:900;margin:15px 0;color:#fff}.count span{font-size:76px;color:#ffce3b;text-shadow:0 0 18px #edaa3555}#target{width:100%;accent-color:#ffcb39;height:36px;touch-action:pan-y}.rangeLabels{display:flex;justify-content:space-between;color:#cbd6e8;font-weight:700}.card{background:#101a30;border-color:#f0b637;box-shadow:0 0 18px #f0b63720}.primary{background:linear-gradient(#ffe55d,#e9a91a);border:2px solid #fff0a0;box-shadow:0 4px 0 #8e5b08;font-size:20px}.primary:disabled{opacity:.5}#hero{border-bottom:0}#hero img{aspect-ratio:832/448;max-height:none;object-fit:cover}.shell{max-width:540px}#setup h2{font-size:24px}#startGame{margin-top:16px}#countdown:not(:empty){padding:15px} </style></head><body><div class="shell" id="lobby"><section id="hero"><img src="game-hero.png" alt="赤・青・黄色のゲームキャラクター"></section><div class="card" id="setup"><h2 style="text-align:center">参加人数を選択</h2><div class="count"><span id="targetDisplay">12</span> 人</div><input id="target" type="range" min="1" max="19" value="12" step="1" aria-label="参加人数"><div class="rangeLabels"><span>1人</span><span>19人</span></div><button class="primary" id="createRoom">この人数で進む</button><p class="error" id="setupError"></p></div><div class="card hidden" id="register"><h2>ゲームに参加</h2><label>ユーザーネーム</label><input class="field" id="name" maxlength="8" placeholder="名前を入力（8文字まで）"><div style="margin-top:14px">チームカラーを選択</div><div class="teams" id="teamBtns"></div><button class="primary" id="join">この名前で参加する</button><p class="error" id="error"></p></div><div class="card hidden" id="waiting"><h2>参加者待機中</h2><div id="joinedNum" style="font-size:32px;font-weight:900;text-align:center">0 / 12人</div><div class="progress"><div id="bar" style="width:0%"></div></div><div class="stats" id="stats"></div><div class="names" id="names"></div><div id="countdown"></div><button class="primary" id="startGame">ゲーム開始（10秒後）</button><button class="secondary" id="leave" style="margin-top:10px">参加を取り消す</button></div></div><div class="game hidden" id="game"><div class="top"><b>大戦闘先東ブラザーズ</b><span id="myHp">♥♥♥</span><span id="time">0秒</span></div><div class="stats" id="gameStats" style="padding:0 8px;margin:2px 0"></div><div id="arenaWrap"><canvas id="arena"></canvas><div id="overlay"></div></div><div id="padWrap"><b id="padLabel">下の円を押した方向へ逃げる！</b><div id="pad"><div id="pointer"></div><div id="padName"></div></div></div></div><div id="final"><div><h1 id="loserTitle">チーム全滅！</h1><img src="final-face.jpg" alt="ゴーゴーわっしょい"><h2>ゴーゴーわっしょい！</h2><p>次のゲームはページを更新して確認してください</p><button class="secondary" onclick="location.reload()">待機画面を見る</button></div></div><script>
(()=>{'use strict';const colors=['#ee6262','#5699f6','#f1c847','#5bcf84'],labels=['赤','青','黄','緑'];let selected=0,ws=null,myId=null,token=localStorage.getItem('sento-player-token')||'',phase='setup',configured=false,players=[],ghosts=[],target=12,countdownAt=0,startedAt=0,loser=null,lastFrame=0,elapsed=0,down=false,dir={x:0,y:0};const $=id=>document.getElementById(id);const buttons=$('teamBtns');colors.forEach((color,i)=>{let b=document.createElement('button');b.className='team'+(!i?' sel':'');b.style.background=color;b.textContent=labels[i];b.onclick=()=>{selected=i;[...buttons.children].forEach((x,j)=>x.classList.toggle('sel',i===j))};buttons.append(b)});$('name').value=localStorage.getItem('sento-name')||'';function send(o){if(ws?.readyState===1){ws.send(JSON.stringify(o));return true}const msg='通信が切断されています。再接続を待ってください。';$('error').textContent=msg;$('setupError').textContent=msg;return false}function connect(){let protocol=location.protocol==='https:'?'wss:':'ws:';ws=new WebSocket(protocol+'//'+location.host+'/api/ws');ws.onopen=()=>{if(token)send({type:'join',token});};ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='joined'){myId=m.id;token=m.token;localStorage.setItem('sento-player-token',token)}else if(m.type==='error'){$('error').textContent=m.message;$('setupError').textContent=m.message}else if(m.type==='removed'){token='';myId=null;localStorage.removeItem('sento-player-token');location.reload()}else if(m.type==='frame'){lastFrame=Date.now();elapsed=m.elapsed;for(let row of m.players){let p=players.find(x=>x.id===row[0]);if(p){p.x=row[1];p.y=row[2];p.hp=row[3];p.alive=row[4];p.immune=row[5]}}ghosts=m.ghosts.map(g=>({x:g[0],y:g[1],idx:g[2]}));$('time').textContent=elapsed+'秒';updateStats()}else if(m.type==='hit'&&m.id===myId){if(navigator.vibrate)navigator.vibrate(150);$('padLabel').textContent=m.hp?'捕まった！ 残り'+m.hp+'ライフ':'3回捕まった！ 観戦中'}else if(m.type==='state'||m.type==='hello'){phase=m.phase;configured=m.configured;target=m.target;players=m.players;ghosts=m.ghosts;countdownAt=m.countdownAt;startedAt=m.startedAt;loser=m.loser;renderState()}};ws.onclose=()=>{$('setupError').textContent='ゲームサーバーに接続できません。Workersの公開設定を確認してください。';$('error').textContent='通信が切断されました';setTimeout(connect,1800)};ws.onerror=()=>{$('setupError').textContent='通信に接続できません'}}connect();$('join').onclick=()=>{let name=$('name').value.trim();if(!name){$('error').textContent='名前を入力してね';return}localStorage.setItem('sento-name',name);send({type:'join',name,team:selected,token});};$('createRoom').onclick=()=>{const n=Number($('target').value);if(!Number.isInteger(n)||n<1||n>19){$('setupError').textContent='1〜19人を選んでください';return}if(ws?.readyState!==1){$('setupError').textContent='ゲームサーバーに接続できません';return}send({type:'configure',value:n})};$('leave').onclick=()=>send({type:'leave'});$('startGame').onclick=()=>{if(ws?.readyState!==1){$('setupError').textContent='通信に接続できません';return}send({type:'start'})};$('target').addEventListener('input',()=>{$('targetDisplay').textContent=$('target').value});
function renderState(){let registered=players.some(p=>p.id===myId);$('setup').classList.toggle('hidden',phase!=='setup'||configured);$('createRoom').disabled=players.length>0;$('register').classList.toggle('hidden',registered||phase!=='setup'||!configured);$('waiting').classList.toggle('hidden',!registered||phase==='playing'||phase==='ended');$('game').classList.toggle('hidden',phase!=='playing');$('lobby').classList.toggle('hidden',phase==='playing');$('final').style.display=phase==='ended'?'flex':'none';if(phase==='ended')$('loserTitle').textContent=labels[loser??0]+'チーム全滅！';$('target').value=target;$('targetDisplay').textContent=target;$('joinedNum').textContent=players.length+' / '+target+'人';$('bar').style.width=Math.min(100,players.length/Math.max(1,target)*100)+'%';let counts=[0,0,0,0];players.forEach(p=>{if(phase==='setup'||phase==='countdown'||p.alive)counts[p.team]++});for(let id of ['stats','gameStats'])$(id).innerHTML=counts.map((n,i)=>`<div class="stat" style="background:${colors[i]}">${labels[i]} ${n}人</div>`).join('');$('names').innerHTML='';for(let p of players){let el=document.createElement('span');el.className='chip';el.style.background=colors[p.team];el.textContent=p.name+(p.id===myId?' (自分)':'');$('names').append(el)}let me=players.find(p=>p.id===myId);if(me){$('padName').textContent=me.name;$('padName').style.background=colors[me.team];$('padName').style.color=me.team===2?'#182335':'white'}if(phase==='countdown')$('waiting').classList.toggle('hidden',!registered);if(phase!=='countdown')$('countdown').textContent='';$('startGame').classList.toggle('hidden',phase!=='setup');updateStats()}
function updateStats(){let me=players.find(p=>p.id===myId);if(me){$('myHp').textContent='♥'.repeat(me.hp)+'♡'.repeat(3-me.hp);if(!me.alive)$('padLabel').textContent='脱落！ 味方を応援しよう'}let counts=[0,0,0,0];players.forEach(p=>{if(p.alive)counts[p.team]++});$('gameStats').innerHTML=counts.map((n,i)=>`<div class="stat" style="background:${colors[i]}">${labels[i]} ${n}人</div>`).join('')}
const canvas=$('arena'),ctx=canvas.getContext('2d'),imgs=[1,2,3,4,5,6,7].map(i=>{let x=new Image();x.src='oni'+i+'.jpg';return x});function draw(){let rect=canvas.getBoundingClientRect(),w=rect.width,h=rect.height;if(w>0&&h>0){let dpr=Math.min(2,devicePixelRatio||1);if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}ctx.setTransform(canvas.width/1000,0,0,canvas.height/700,0,0);ctx.clearRect(0,0,1000,700);ctx.fillStyle='#28425c';ctx.fillRect(0,0,1000,700);ctx.strokeStyle='#ffffff0e';ctx.lineWidth=2;for(let x=0;x<1000;x+=100){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,700);ctx.stroke()}for(let y=0;y<700;y+=100){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(1000,y);ctx.stroke()}for(let p of players){if(!p.alive)continue;let own=p.id===myId,r=own?23:20;if(own){ctx.beginPath();ctx.arc(p.x,p.y,32,0,Math.PI*2);ctx.strokeStyle='#c084fc';ctx.lineWidth=7;ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 19px sans-serif';ctx.textAlign='center';ctx.fillText('▼ YOU',p.x,p.y-42)}ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fillStyle=colors[p.team];ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle=p.team===2?'#162034':'#fff';ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.fillText(p.name,p.x,p.y+5);if(own){ctx.fillStyle='#fff';ctx.font='bold 16px sans-serif';ctx.fillText('♥'.repeat(p.hp),p.x,p.y+48)}if(p.immune){ctx.strokeStyle='#ffffff77';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,36,0,Math.PI*2);ctx.stroke()}}for(let g of ghosts){ctx.save();ctx.beginPath();ctx.arc(g.x,g.y,30,0,Math.PI*2);ctx.clip();let im=imgs[g.idx];if(im?.complete&&im.naturalWidth){let s=Math.min(im.width,im.height),sx=(im.width-s)/2,sy=Math.max(0,(im.height-s)*.18);ctx.drawImage(im,sx,sy,s,s,g.x-30,g.y-30,60,60)}else{ctx.fillStyle='#f66';ctx.fillRect(g.x-30,g.y-30,60,60)}ctx.restore();ctx.beginPath();ctx.arc(g.x,g.y,31,0,Math.PI*2);ctx.strokeStyle='#ff6262';ctx.lineWidth=6;ctx.stroke()}}requestAnimationFrame(draw)}requestAnimationFrame(draw);
const pad=$('pad'),pointer=$('pointer');function control(e){let r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,l=Math.hypot(dx,dy);if(l<8){send({type:'move',x:0,y:0});return}dir={x:dx/l,y:dy/l};pointer.style.display='block';pointer.style.transform=`rotate(${Math.atan2(dy,dx)}rad)`;send({type:'move',x:dir.x,y:dir.y})}pad.addEventListener('pointerdown',e=>{e.preventDefault();down=true;pad.setPointerCapture(e.pointerId);control(e)});pad.addEventListener('pointermove',e=>{if(down)control(e)});function stop(){down=false;pointer.style.display='none';send({type:'move',x:0,y:0})}pad.addEventListener('pointerup',stop);pad.addEventListener('pointercancel',stop);window.addEventListener('blur',stop);setInterval(()=>{if(down)send({type:'move',...dir});if(phase==='countdown'){$('countdown').textContent='あと'+Math.max(0,Math.ceil((countdownAt-Date.now())/1000))+'秒でスタート'}},250);
})();
</script></body></html>
